<div class="loader-bg" #loaderBg>
  <!-- Background Quantum Swirl Particle Canvas -->
  <canvas id="loader-canvas" class="loader-canvas" #loaderCanvas></canvas>

  <!-- Background Grid & HUD Vignette overlays -->
  <div class="loader-grid"></div>
  <div class="loader-glow-radial"></div>
  <div class="hud-scanline"></div>
  <div class="hud-glitch-overlay" #glitchOverlay></div>
  <div class="loader-flash" #loaderFlash></div>
  <div class="laser-swipe" #laserSwipe></div>

  <!-- Top Viewport HUD Data Rails -->
  <div class="loader-top-hud font-mono">
    <div class="top-hud-left">
      <span class="hud-badge gold"><span class="pill-dot green"></span> KERNEL: v5.19-LTS</span>
      <span class="hud-badge text-muted">OPERATOR: ESHWAR J.</span>
      <span class="hud-badge text-muted">ROLE: SENIOR FULLSTACK ARCHITECT</span>
    </div>
    <div class="top-hud-right">
      <span class="hud-badge gold">CLOCK: 4.80 GHz [OVERCLOCKED]</span>
      <span class="hud-badge text-muted">LATENCY: 0.8ms</span>
      <span class="hud-badge green">STATUS: NOMINAL</span>
    </div>
  </div>

  <!-- Central Concentric Cyber-Hologram & Avatar Assembly -->
  <div class="loader-center-assembly" #centerAssembly>
    <div class="hologram-container">
      <!-- Hexagonal Cyber-Pod Avatar Frame -->
      <div class="cyber-avatar-hex">
        <img src="/eshwar.jpg" alt="Eshwar J." class="hex-avatar-img" />
        <div class="hex-scanline"></div>
        <div class="hex-glow-border"></div>
      </div>

      <svg class="hologram-svg" viewBox="0 0 200 200">
        <!-- Outer tick mark compass ring -->
        <circle class="circle-outer" cx="100" cy="100" r="94" fill="none" stroke="rgba(197, 168, 128, 0.3)" stroke-width="1.5" stroke-dasharray="4 8" />
        
        <!-- Middle counter-rotating HUD ring -->
        <circle class="circle-middle" cx="100" cy="100" r="82" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="35 20 8 20" />
        
        <!-- Inner active progress circle -->
        <circle class="circle-progress" cx="100" cy="100" r="70" fill="none" stroke="var(--color-accent)" stroke-width="3" #progressCircle />

        <!-- Cyber Corner HUD Ticks -->
        <path d="M 20,40 L 20,20 L 40,20" fill="none" stroke="rgba(197, 168, 128, 0.5)" stroke-width="2" />
        <path d="M 180,40 L 180,20 L 160,20" fill="none" stroke="rgba(197, 168, 128, 0.5)" stroke-width="2" />
        <path d="M 20,160 L 20,180 L 40,180" fill="none" stroke="rgba(197, 168, 128, 0.5)" stroke-width="2" />
        <path d="M 180,160 L 180,180 L 160,180" fill="none" stroke="rgba(197, 168, 128, 0.5)" stroke-width="2" />
        
      </svg>
    </div>

    <!-- HUD Control Terminal Deck -->
    <div class="hud-control-panel">
      <div class="hud-header font-mono">
        <div class="hud-title-wrap">
          <span class="hud-name accent-gold">ESHWAR J.</span>
          <span class="hud-title">SYSTEM ARCHITECTURE BOOTSTRAP</span>
        </div>
        <div class="hud-ping-wrap">
          <span class="hud-ping">60 FPS</span>
          <span class="pill-dot green"></span>
        </div>
      </div>

      <div class="hud-terminal font-mono" #statusTerminal>
        <!-- status log lines will be appended dynamically by controller -->
      </div>

      <div class="hud-footer">
        <!-- Scoped LED Progress Bar Track -->
        <div class="progress-bar-wrap">
          <div class="progress-bar" #progressBar></div>
        </div>

        <div class="percentage-wrap font-mono">
          <span class="percentage" #percentText>00</span>
          <span class="percentage-symbol">%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom HUD Status Line -->
  <div class="loader-bottom-hud font-mono">
    <span>INGRESS: HTTP/3 // SSL TLS_AES_256_GCM_SHA384</span>
    <span>LOCATION: BENGALURU, IN // REMOTE WORLDWIDE</span>
  </div>
</div>

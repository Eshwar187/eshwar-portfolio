<div class="loader-bg" #loaderBg>
  <!-- Background Grid lines for high-tech HUD feel -->
  <div class="loader-grid"></div>
  <div class="loader-glow-radial"></div>
  <div class="hud-scanline"></div>
  <div class="hud-glitch-overlay" #glitchOverlay></div>
  <div class="loader-flash" #loaderFlash></div>
  <div class="laser-swipe" #laserSwipe></div>

  <!-- Central Concentric Ring & Monogram Assembly -->
  <div class="loader-center-assembly" #centerAssembly>
    <div class="hologram-container">
      <svg class="hologram-svg" viewBox="0 0 160 160">
        <!-- Outer dotted rotating ring -->
        <circle class="circle-outer" cx="80" cy="80" r="75" fill="none" stroke="rgba(197, 168, 128, 0.12)" stroke-width="1" stroke-dasharray="3 6" />
        
        <!-- Middle segmented rotating ring -->
        <circle class="circle-middle" cx="80" cy="80" r="66" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" stroke-dasharray="25 15 5 15" />
        
        <!-- Inner active progress circle -->
        <circle class="circle-progress" cx="80" cy="80" r="56" fill="none" stroke="var(--color-accent)" stroke-width="2" #progressCircle />
        
        <!-- Monogram letter 'E' drawing path -->
        <path class="monogram-path" d="M 50,45 H 70 M 60,45 V 115 M 50,115 H 70 M 60,45 H 105 V 53 M 60,80 H 95 V 86 M 60,115 H 105 V 107" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" #monogramPath />
      </svg>
      <!-- Central filled monogram symbol that fades in -->
      <div class="monogram-letter font-display" #monogramLetter>E</div>
    </div>

    <!-- HUD Control Panel -->
    <div class="hud-control-panel">
      <div class="hud-header">
        <span class="hud-title">LEXICAL INGESTION</span>
        <span class="hud-ping">60 FPS</span>
      </div>

      <div class="hud-terminal" #statusTerminal>
        <!-- status log lines will be appended dynamically by controller -->
      </div>

      <div class="hud-footer">
        <div class="progress-bar-wrap">
          <div class="progress-bar" #progressBar></div>
        </div>
        <div class="percentage-wrap">
          <span class="percentage" #percentText>00</span>
          <span class="percentage-symbol">%</span>
        </div>
      </div>
    </div>
  </div>
</div>
